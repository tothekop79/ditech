services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ditech
      POSTGRES_PASSWORD: ditech_dev
      POSTGRES_DB: ditech_planner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ditech -d ditech_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://ditech:ditech_dev@postgres:5432/ditech_planner
      REDIS_URL: redis://redis:6379
      ENGINE_TIMEOUT_MS: ${ENGINE_TIMEOUT_MS:-900000}
      VION_MALL_BASE_URL: ${VION_MALL_BASE_URL:-http://mall.vion-cloud.com:18080}
      VION_MALL_APPKEY: ${VION_MALL_APPKEY}
      VION_MALL_USERNAME: ${VION_MALL_USERNAME}
      VION_MALL_PASSWORD: ${VION_MALL_PASSWORD}
      VION_RETAIL_BASE_URL: ${VION_RETAIL_BASE_URL:-http://retail.vionyun.com:18085}
      VION_RETAIL_APPKEY: ${VION_RETAIL_APPKEY}
      VION_RETAIL_USERNAME: ${VION_RETAIL_USERNAME}
      VION_RETAIL_PASSWORD: ${VION_RETAIL_PASSWORD}
      VION_POLL_INTERVAL_MS: ${VION_POLL_INTERVAL_MS:-300000}
      VION_OFFLINE_GRACE_MS: ${VION_OFFLINE_GRACE_MS:-600000}
      VION_MONITOR_ENABLED: ${VION_MONITOR_ENABLED:-true}
      NODE_OPTIONS: "${NODE_OPTIONS:---max-old-space-size=8192}"
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_PM_GROUP_CHAT_ID: ${TELEGRAM_PM_GROUP_CHAT_ID:-}
      TELEGRAM_CUSTOMER_GROUP_CHAT_ID: ${TELEGRAM_CUSTOMER_GROUP_CHAT_ID:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      NODE_ENV: development
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
